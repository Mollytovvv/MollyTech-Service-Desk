<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>


<body style="font-family: Arial, sans-serif; background:#f8fafc; padding:40px;">


<div style="
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    border:1px solid #e5e7eb;
">


<h2 style="color:#111827;">
    Password Reset Request
</h2>


<p style="color:#374151; font-size:15px;">
We received a request to reset your MollyTech Service Desk password.
</p>


<div style="text-align:center; margin:30px 0;">

<a href="{{resetLink}}"
style="
background:#dc2626;
color:white;
padding:12px 24px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
display:inline-block;
">

Reset Password

</a>

</div>


<p style="color:#6b7280; font-size:14px;">
This password reset link will expire after 15 minutes.
</p>


<p style="color:#6b7280; font-size:14px;">
If you did not request a password reset, ignore this email.
</p>


<br>


<p style="color:#111827;">
Regards,<br>
<strong>MollyTech Service Desk</strong>
</p>


</div>


</body>

</html>
